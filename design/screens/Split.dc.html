<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split view — compare across clusters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.hv:hover{background:var(--hover)}
</style>
</helmet>
<div style="{{vars}}font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;color:var(--fg);background:var(--editor);width:100%;height:900px;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">
    <div style="flex:0 0 auto;display:flex"><dc-import name="Nav" theme="{{theme}}" mode="cluster" active="deployments" hint-size="200px,874px"></dc-import></div>
    <div style="flex:999 1 560px;min-width:0;height:874px;display:flex;flex-direction:column">


      <div style="flex:1;min-height:0;display:flex">
        <sc-for list="{{panes}}" as="p" hint-placeholder-count="2">
          <section aria-label="{{p.aria}}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;{{p.border}}">
            <dc-import name="PaneTabs" theme="{{theme}}" tabs="{{p.tabs}}" focused="{{p.focused}}" on-pick="{{p.pick}}" hint-size="100%,32px"></dc-import>
            <div style="flex:1;min-height:0;overflow:auto">

              <sc-if value="{{p.isDeploy}}" hint-placeholder-val="{{ true }}">
                <div>
                  <div style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)">
                    <div style="display:flex;align-items:center;gap:10px">
                      <h2 style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600">checkout-api</h2>
                      <span style="font-size:12.5px;color:{{p.d.c}}">{{p.d.status}}</span>
                      <span style="flex:1"></span>
                      <span style="font-size:12px;color:var(--mute)">{{p.d.cluster}}</span>
                    </div>
                    <p style="margin:0;font-size:12.5px;color:var(--fg2);line-height:1.5">{{p.d.sentence}}</p>
                  </div>
                  <div style="border-bottom:1px solid var(--line)">
                    <sc-for list="{{p.d.fields}}" as="f" hint-placeholder-count="7">
                      <div style="display:grid;grid-template-columns:16px 150px minmax(0,1fr);column-gap:8px;align-items:center;min-height:26px;padding:3px 16px 3px 8px;border-top:1px solid var(--line);font-size:12.5px;{{f.bg}}">
                        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--warn)">{{f.mark}}</span>
                        <span style="color:var(--mute)">{{f.label}}</span>
                        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{f.vc}};word-break:break-word">{{f.value}}</span>
                      </div>
                    </sc-for>
                  </div>
                  <div style="padding:12px 16px 4px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)">Pods</div>
                  <sc-for list="{{p.d.pods}}" as="o" hint-placeholder-count="3">
                    <div class="hv" style="display:grid;grid-template-columns:14px minmax(0,1fr) 120px 30px;column-gap:10px;align-items:center;height:26px;padding:0 16px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:12px">
                      <span style="font-size:10.5px;color:{{o.c}}">{{o.g}}</span>
                      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{o.name}}</span>
                      <span style="color:{{o.c}}">{{o.status}}</span>
                      <span style="color:var(--mute);text-align:right">{{o.r}}</span>
                    </div>
                  </sc-for>
                </div>
              </sc-if>

              <sc-if value="{{p.isLogs}}" hint-placeholder-val="{{ false }}">
                <div style="padding:6px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:19px">
                  <sc-for list="{{logs}}" as="l" hint-placeholder-count="8">
                    <div style="display:flex;gap:12px;padding:0 14px;white-space:pre;{{l.bg}}"><span style="color:var(--mute)">{{l.ts}}</span><span style="width:40px;flex:none;color:{{l.c}}">{{l.lvl}}</span><span>{{l.msg}}</span></div>
                  </sc-for>
                </div>
              </sc-if>

              <sc-if value="{{p.isKs}}" hint-placeholder-val="{{ false }}">
                <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">
                  <div style="display:flex;align-items:center;gap:10px">
                    <h2 style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600">apps-payments</h2>
                    <span style="font-size:12.5px;color:{{p.k.c}}">{{p.k.status}}</span>
                  </div>
                  <p style="margin:0;font-size:12.5px;color:var(--fg2);line-height:1.5">{{p.k.sentence}}</p>
                  <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)">{{p.k.rev}}</div>
                  <a href="Kustomization.dc.html" style="font-size:12.5px;color:var(--acc);text-decoration:none">Open full view →</a>
                </div>
              </sc-if>
            </div>
          </section>
        </sc-for>
      </div>
    </div>
  </div>
  <dc-import name="StatusBar" theme="{{theme}}" left="2 panes · ⌘\ split · ⌘W close tab" agent="4s ago" cluster="prod-us-east" hint-size="100%,26px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","dark","light"],"default":"system"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: 0, right: 0, hl: true, focus: 0 };
  }
  vars() {
    let t = this.props.theme ?? 'system';
    if (t !== 'dark' && t !== 'light') { try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } }
    const D = '--editor:#111317;--panel:#15181D;--chrome:#1A1D22;--raise:#20242A;--hover:#1D2127;--line:#262A30;--line2:#323740;--guide:#2A2E35;--fg:#DCDFE4;--fg2:#B3B9C3;--mute:#8E96A3;--sep:#4C525C;--sel:#1F2C40;--selfg:#F2F6FC;--selline:#3A5A8C;--acc:#74ADFF;--onacc:#0C1220;--ok:#48C78E;--warn:#E8B04B;--err:#F26D6D;--sus:#9AA2AE;--okbg:rgba(72,199,142,.10);--errbg:rgba(242,109,109,.11);--warnbg:rgba(232,176,75,.10);--accbg:rgba(116,173,255,.12);--addbg:rgba(72,199,142,.12);--delbg:rgba(242,109,109,.13);--addfg:#7FDDB2;--delfg:#FF9C9C;--shadow:rgba(0,0,0,.5);color-scheme:dark;';
    const L = '--editor:#FFFFFF;--panel:#F6F7F8;--chrome:#EEEFF1;--raise:#E9EBEE;--hover:#F1F2F4;--line:#E1E3E7;--line2:#CFD3D9;--guide:#E4E6EA;--fg:#1D2027;--fg2:#3B414B;--mute:#5F6774;--sep:#A5ABB5;--sel:#DCE7FA;--selfg:#0D2850;--selline:#8DB0EA;--acc:#1F5FD1;--onacc:#FFFFFF;--ok:#167A4C;--warn:#935800;--err:#C53030;--sus:#6B7280;--okbg:rgba(22,122,76,.08);--errbg:rgba(197,48,48,.07);--warnbg:rgba(147,88,0,.08);--accbg:rgba(31,95,209,.08);--addbg:rgba(22,122,76,.10);--delbg:rgba(197,48,48,.09);--addfg:#0F5E3A;--delfg:#A12626;--shadow:rgba(20,24,32,.18);color-scheme:light;';
    return { theme: t, vars: t === 'light' ? L : D };
  }
  renderVals() {
    const v = this.vars();
    const deploy = {
      east: {
        cluster: 'prod-us-east', status: '✕ 2/3 ready', c: 'var(--err)',
        sentence: 'Progressing=False · ProgressDeadlineExceeded',
        fields: [['Ready', '2/3', 'err'], ['Image', 'checkout-api:2.14.0'], ['Revision', '37 · 3h ago'], ['STRIPE_WEBHOOK_SECRET', 'stripe / webhook_secret · key not found', 'err'], ['Replicas (HPA)', '3 · 3–12 @ 70% cpu'], ['CPU req / limit', '500m / 1'], ['Memory req / limit', '512Mi / 1Gi'], ['Managed by', 'apps-payments @ a41e07c']],
        pods: [['err', 'checkout-api-7f9c6d-x2lqp', 'CrashLoopBackOff', '14'], ['ok', 'checkout-api-7f9c6d-m8vtn', 'Running', '0'], ['ok', 'checkout-api-7f9c6d-q4zhk', 'Running', '0']]
      },
      west: {
        cluster: 'prod-eu-west', status: '● 3/3 ready', c: 'var(--ok)',
        sentence: 'Available=True · MinimumReplicasAvailable',
        fields: [['Ready', '3/3'], ['Image', 'checkout-api:2.13.4'], ['Revision', '35 · 2d ago'], ['STRIPE_WEBHOOK_SECRET', 'stripe / webhook-secret'], ['Replicas (HPA)', '3 · 3–12 @ 70% cpu'], ['CPU req / limit', '500m / 1'], ['Memory req / limit', '512Mi / 1Gi'], ['Managed by', 'apps-payments @ 7c2d9e0 (suspended)']],
        pods: [['ok', 'checkout-api-5b8f2a-k2p9w', 'Running', '0'], ['ok', 'checkout-api-5b8f2a-v7c1d', 'Running', '0'], ['ok', 'checkout-api-5b8f2a-z4m6t', 'Running', '0']]
      }
    };
    const ks = {
      east: { status: '✕ Failing', c: 'var(--err)', sentence: 'Ready=False · HealthCheckFailed', rev: 'applied a41e07c · 3h ago' },
      west: { status: '‖ Suspended', c: 'var(--sus)', sentence: 'spec.suspend=true · last applied 7c2d9e0', rev: 'applied 7c2d9e0 · 2d ago' }
    };
    const leftTabs = [
      { kind: 'deploy', label: 'checkout-api', ctx: 'us-east', g: '✕', gc: 'var(--err)', view: 'deploy', at: 'east' },
      { kind: 'logs', label: 'x2lqp', ctx: 'us-east', view: 'logs', at: 'east' },
      { kind: 'ks', label: 'apps-payments', ctx: 'us-east', view: 'ks', at: 'east' }
    ];
    const rightTabs = [
      { kind: 'deploy', label: 'checkout-api', ctx: 'eu-west', g: '●', gc: 'var(--ok)', view: 'deploy', at: 'west' },
      { kind: 'ks', label: 'apps-payments', ctx: 'eu-west', view: 'ks', at: 'west' }
    ];
    const L = leftTabs[this.state.left], R = rightTabs[this.state.right];
    const comparing = L.view === 'deploy' && R.view === 'deploy';
    const hl = false;
    const other = (side) => deploy[side === 'east' ? 'west' : 'east'];
    let diffCount = 0;
    deploy.east.fields.forEach((f, i) => { if (f[1] !== deploy.west.fields[i][1]) diffCount++; });
    const mkDeploy = (side) => {
      const d = deploy[side];
      const o = other(side);
      return {
        cluster: d.cluster, status: d.status, c: d.c, sentence: d.sentence,
        fields: d.fields.map((f, i) => {
          const differs = f[1] !== o.fields[i][1];
          return { label: f[0], value: f[1], vc: f[2] === 'err' ? 'var(--err)' : 'var(--fg)', mark: hl && differs ? '≠' : '', bg: hl && differs ? 'background:var(--warnbg);' : '' };
        }),
        pods: d.pods.map((p) => ({ g: p[0] === 'ok' ? '●' : '✕', c: p[0] === 'ok' ? 'var(--ok)' : 'var(--err)', name: p[1], status: p[2], r: p[3] }))
      };
    };
    const mkPane = (i, tabs, sel, key) => {
      const t = tabs[sel];
      return {
        aria: i === 0 ? 'Left pane' : 'Right pane',
        border: i === 0 ? '' : 'border-left:1px solid var(--line2);',
        focused: this.state.focus === i,
        focus: () => { if (this.state.focus !== i) this.setState({ focus: i }); },
        tabs: tabs.map((x, j) => ({ ...x, active: j === sel })),
        pick: (j) => this.setState({ [key]: j, focus: i }),
        isDeploy: t.view === 'deploy', isLogs: t.view === 'logs', isKs: t.view === 'ks',
        d: mkDeploy(t.at), k: ks[t.at]
      };
    };
    const Lg = (ts, lvl, msg) => ({ ts, lvl, msg, c: lvl === 'ERROR' || lvl === 'FATAL' ? 'var(--err)' : (lvl === 'WARN' ? 'var(--warn)' : 'var(--acc)'), bg: lvl === 'ERROR' || lvl === 'FATAL' ? 'background:var(--errbg);' : '' });
    return {
      theme: v.theme, vars: v.vars,
      comparing, hl, diffCount,
      toggleHl: () => this.setState({ hl: !this.state.hl }),
      panes: [mkPane(0, leftTabs, this.state.left, 'left'), mkPane(1, rightTabs, this.state.right, 'right')],
      logs: [
        Lg('21:12:20.114', 'INFO', 'starting checkout-api v2.14.0'),
        Lg('21:12:20.228', 'INFO', 'postgres: ok (pool 20)'),
        Lg('21:12:20.230', 'WARN', 'env STRIPE_WEBHOOK_SECRET is empty; falling back to /etc/checkout/stripe.env'),
        Lg('21:12:20.231', 'ERROR', 'open /etc/checkout/stripe.env: no such file or directory'),
        Lg('21:12:20.231', 'FATAL', 'config invalid: stripe webhook secret not set; exit 1')
      ]
    };
  }
}
</script>
</body>
</html>
