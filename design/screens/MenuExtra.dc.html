<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS menu bar extra</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{vars}}position:relative;width:700px;height:720px;overflow:hidden;background:var(--desk);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;font-size:13px;color:var(--mfg)">
  <div style="height:26px;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 14px;background:var(--bar);font-size:13px;color:var(--mfg)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6.5a9 9 0 0 1 12 0M4.2 9a5.6 5.6 0 0 1 7.6 0M6.4 11.4a2.3 2.3 0 0 1 3.2 0"/></svg>
    <svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x=".6" y=".6" width="18" height="10.8" rx="2.6"/><rect x="2.4" y="2.4" width="11" height="7.2" rx="1.2" fill="currentColor" stroke="none"/><path d="M20.4 4.2v3.6" stroke-linecap="round"/></svg>
    <button aria-label="Flock, 3 errors" aria-expanded="true" style="height:22px;display:flex;align-items:center;gap:4px;padding:0 6px;border:0;border-radius:5px;background:var(--barSel);color:var(--mfg);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">
      <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 11.2c-1.5 0-2.5-1-2.3-2.3.2-1 1-1.6 2-1.6.2-1.4 1.4-2.3 2.8-2.2.7-1 1.8-1.5 3-1.3 1.1.2 1.9 1 2.2 2 .4-.1.8 0 1.1.1"/><ellipse cx="14.4" cy="7.4" rx="2" ry="2.3"/><path d="M4.2 11.2h7.4c.9 0 1.6-.5 2-1.2M5.6 11.2v3M8.8 11.2v3M11.2 11.2v3"/></svg>
      <span>✕3</span>
    </button>
    <span>Tue 20 Oct  9:25</span>
  </div>

  <div role="menu" aria-label="Flock" style="position:absolute;top:30px;right:96px;width:280px;box-sizing:border-box;padding:5px;border-radius:10px;background:var(--menu);border:1px solid var(--menuLine);box-shadow:0 12px 40px var(--menuShadow)">
    <sc-for list="{{clusters}}" as="c" hint-placeholder-count="6">
      <div role="menuitem" style="display:flex;align-items:center;gap:8px;height:24px;padding:0 9px;border-radius:5px;{{c.row}}">
        <span style="width:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{c.dot}}">{{c.g}}</span>
        <span style="flex:1;color:{{c.fc}}">{{c.name}}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:{{c.mc}}">{{c.meta}}</span>
      </div>
    </sc-for>
    <div style="height:1px;background:var(--menuLine);margin:5px 9px"></div>
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
      <div role="menuitem" style="display:flex;align-items:center;height:24px;padding:0 9px 0 27px;border-radius:5px">
        <span style="flex:1">{{a.label}}</span>
        <span style="color:var(--msub);font-size:12px">{{a.key}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":700,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const vars = dark
      ? '--desk:#1F2632;--bar:rgba(20,22,28,.72);--barSel:rgba(255,255,255,.18);--mfg:#F5F5F7;--msub:#A1A1A6;--menu:rgba(40,40,44,.94);--menuLine:rgba(255,255,255,.10);--menuShadow:rgba(0,0,0,.55);--hl:#0A64D6;--mok:#4CD07D;--mwarn:#F2B544;--merr:#FF6961;color-scheme:dark;'
      : '--desk:#C7D2E0;--bar:rgba(246,246,248,.78);--barSel:rgba(0,0,0,.12);--mfg:#1D1D1F;--msub:#6E6E73;--menu:rgba(246,246,248,.96);--menuLine:rgba(0,0,0,.10);--menuShadow:rgba(20,24,32,.28);--hl:#0A64D6;--mok:#1F8A4C;--mwarn:#A35F00;--merr:#C9302C;color-scheme:light;';
    const G = { ok: '●', err: '✕', warn: '▲', off: '○' };
    const C = { ok: 'var(--mok)', err: 'var(--merr)', warn: 'var(--mwarn)', off: 'var(--msub)' };
    const list = [
      { name: 'prod-us-east', s: 'err', meta: '✕2 ▲3', mc: 'err', hover: true },
      { name: 'prod-eu-west', s: 'ok', meta: '', mc: 'sub' },
      { name: 'staging', s: 'warn', meta: '▲2', mc: 'warn' },
      { name: 'dev-kind', s: 'ok', meta: '', mc: 'sub' },
      { name: 'qa-gke', s: 'err', meta: 'auth expired', mc: 'err' },
      { name: 'edge-k3s', s: 'off', meta: 'offline', mc: 'sub' }
    ];
    const clusters = list.map((c) => ({
      name: c.name, g: G[c.s], meta: c.meta,
      dot: c.hover ? '#FFFFFF' : C[c.s],
      fc: c.hover ? '#FFFFFF' : (c.s === 'off' ? 'var(--msub)' : 'var(--mfg)'),
      mc: c.hover ? 'rgba(255,255,255,.85)' : (c.mc === 'err' ? 'var(--merr)' : (c.mc === 'warn' ? 'var(--mwarn)' : 'var(--msub)')),
      row: c.hover ? 'background:var(--hl);' : ''
    }));
    return {
      vars, clusters,
      actions: [
        { label: 'Open Flock', key: '⌘O' },
        { label: 'Pause notifications', key: '' },
        { label: 'Quit Flock', key: '⌘Q' }
      ]
    };
  }
}
</script>
</body>
</html>
