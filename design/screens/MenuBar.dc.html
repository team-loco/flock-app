<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS menu bar item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;padding:24px;background:#E9EBEE;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#1D2027;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;gap:24px">
    <div style="border-radius:6px;overflow:hidden"><dc-import name="MenuExtra" theme="light" hint-size="700px,720px"></dc-import></div>
    <div style="border-radius:6px;overflow:hidden"><dc-import name="MenuExtra" theme="dark" hint-size="700px,720px"></dc-import></div>
  </div>
  <div style="display:flex;align-items:center;gap:28px;font-size:12.5px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5F6774">Menu bar icon states</span>
    <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
      <span style="display:flex;align-items:center;gap:10px">
        <span style="height:22px;display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:5px;background:#F6F6F8;color:#1D1D1F;font-size:12px;font-weight:600;{{s.dim}}">
          <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 11.2c-1.5 0-2.5-1-2.3-2.3.2-1 1-1.6 2-1.6.2-1.4 1.4-2.3 2.8-2.2.7-1 1.8-1.5 3-1.3 1.1.2 1.9 1 2.2 2 .4-.1.8 0 1.1.1"/><ellipse cx="14.4" cy="7.4" rx="2" ry="2.3"/><path d="M4.2 11.2h7.4c.9 0 1.6-.5 2-1.2M5.6 11.2v3M8.8 11.2v3M11.2 11.2v3"/></svg>
          <span>{{s.badge}}</span>
        </span>
        <span style="color:#5F6774">{{s.label}}</span>
      </span>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      states: [
        { badge: '', label: 'all healthy', dim: '' },
        { badge: '▲6', label: 'warnings only', dim: '' },
        { badge: '✕3', label: 'errors', dim: '' },
        { badge: '', label: 'no cluster reachable', dim: 'opacity:.45;' }
      ]
    };
  }
}
</script>
</body>
</html>
