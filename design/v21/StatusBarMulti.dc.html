<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status bar — multi-cluster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}.sbh:hover{background:var(--hover)!important}.mh:hover{background:var(--hover)}.mh .gr{opacity:0}.mh:hover .gr{opacity:1}.sbh:hover{background:var(--hover)!important}</style>
</helmet>
<footer style="{{vars}}position:relative;height:26px;width:100%;box-sizing:border-box;border-top:1px solid var(--line);background:var(--chrome);display:flex;align-items:center;padding:0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);white-space:nowrap">
  <a class="sbh" href="ProblemsCorrelated.dc.html" title="Problems" style="height:25px;display:flex;align-items:center;gap:10px;padding:0 12px;text-decoration:none;border-right:1px solid var(--line)"><span style="color:var(--err)"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:1em;margin-right:.35em;height:1em;vertical-align:-.14em;overflow:visible;flex:none"><path d="M8 1.6 14.4 8 8 14.4 1.6 8Z" fill="currentColor"></path></svg>{{errs}}</span><span style="color:var(--warn)"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:1em;margin-right:.35em;height:1em;vertical-align:-.14em;overflow:visible;flex:none"><path d="M8 2.2 14.3 13.25H1.7Z M8 6.5v3.1 M8 11.4v.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{warns}}</span></a>
  <sc-if value="{{hasVersion}}" hint-placeholder-val="{{ false }}"><span title="Kubernetes version" style="padding:0 10px">{{version}}</span></sc-if>
  <span style="flex:1"></span>
  <button aria-label="Refresh" title="Refresh" class="sbh" style="display:flex;align-items:center;justify-content:center;width:32px;height:25px;padding:0;border:0;border-left:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
  <button class="sbh" onClick="{{toggle}}" aria-haspopup="menu" aria-expanded="{{open}}" title="Clusters" style="height:25px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:0;border-left:1px solid var(--line);background:{{btnBg}};color:var(--fg);font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--mute)" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1" style="{{fourth}}"/></svg>
    {{label}}<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);font-weight:400">{{more}}</span>
    <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--mute)"><path d="m4 10 4-4 4 4"/></svg>
  </button>
  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div role="menu" aria-label="Clusters" style="position:absolute;right:6px;bottom:30px;width:300px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;box-shadow:0 12px 32px var(--shadow);padding:4px;z-index:20;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--fg)">
      <div role="menuitemcheckbox" aria-checked="{{allC.aria}}" onClick="{{allC.pick}}" style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:3px;cursor:pointer" class="mh"><span style="width:13px;height:13px;flex:none;box-sizing:border-box;border-radius:3px;display:flex;align-items:center;justify-content:center;{{allC.box}}"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="var(--onacc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{allC.mark}}"><path d="{{allC.path}}"/></svg></span>All clusters<span style="flex:1"></span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute)">{{allC.n}}</span></div>
      <div style="height:1px;background:var(--line);margin:2px 2px 4px"></div>
      <sc-for list="{{clusters}}" as="c" hint-placeholder-count="6">
        <div class="mh" style="display:flex;align-items:center;border-radius:3px">
          <div role="menuitemcheckbox" aria-checked="{{c.aria}}" onClick="{{c.pick}}" style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;cursor:pointer;color:{{c.fc}}"><span style="width:13px;height:13px;flex:none;box-sizing:border-box;border-radius:3px;display:flex;align-items:center;justify-content:center;{{c.box}}"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="var(--onacc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{c.mark}}"><path d="{{c.path}}"/></svg></span><span style="overflow:hidden;text-overflow:ellipsis">{{c.name}}</span><span style="flex:1"></span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute)">{{c.meta}}</span></div>
          <button aria-label="{{c.gearLabel}}" title="Cluster settings" class="gr" style="width:26px;height:24px;margin-right:2px;border:0;border-radius:3px;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.25"/><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.6 3.6l1.05 1.05M11.35 11.35l1.05 1.05M3.6 12.4l1.05-1.05M11.35 4.65l1.05-1.05"/></svg></button>
        </div>
      </sc-for>
      <div style="height:1px;background:var(--line);margin:4px 2px"></div>
      <a role="menuitem" href="AddCluster.dc.html" class="mh" style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:3px;text-decoration:none;color:var(--fg2)"><span style="width:13px;text-align:center;color:var(--mute)">+</span>Add cluster…</a>
    </div>
  </sc-if>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","dark","light"],"default":"system"},"sel":{"editor":null},"onSel":{"editor":null},"open":{"editor":"boolean","default":false},"errs":{"editor":"text","default":"3"},"warns":{"editor":"text","default":"6"},"$preview":{"width":1440,"height":26}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: !!props.open, sel: props.sel || ['prod-us-east', 'prod-eu-west'] };
  }
  vars() {
    let t = this.props.theme ?? 'system';
    if (t !== 'dark' && t !== 'light') { try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } }
    const D = '--editor:#111317;--panel:#15181D;--chrome:#1A1D22;--raise:#20242A;--hover:#1D2127;--line:#262A30;--line2:#323740;--guide:#2A2E35;--fg:#DCDFE4;--fg2:#B3B9C3;--mute:#8E96A3;--sep:#4C525C;--sel:#1F2C40;--selfg:#F2F6FC;--selline:#3A5A8C;--acc:#74ADFF;--onacc:#0C1220;--ok:#48C78E;--warn:#E8B04B;--err:#F26D6D;--sus:#9AA2AE;--okbg:rgba(72,199,142,.10);--errbg:rgba(242,109,109,.11);--warnbg:rgba(232,176,75,.10);--accbg:rgba(116,173,255,.12);--addbg:rgba(72,199,142,.12);--delbg:rgba(242,109,109,.13);--addfg:#7FDDB2;--delfg:#FF9C9C;--shadow:rgba(0,0,0,.5);color-scheme:dark;';
    const L = '--editor:#FFFFFF;--panel:#F6F7F8;--chrome:#EEEFF1;--raise:#E9EBEE;--hover:#F1F2F4;--line:#E1E3E7;--line2:#CFD3D9;--guide:#E4E6EA;--fg:#1D2027;--fg2:#3B414B;--mute:#5F6774;--sep:#A5ABB5;--sel:#DCE7FA;--selfg:#0D2850;--selline:#8DB0EA;--acc:#1F5FD1;--onacc:#FFFFFF;--ok:#167A4C;--warn:#935800;--err:#C53030;--sus:#6B7280;--okbg:rgba(22,122,76,.08);--errbg:rgba(197,48,48,.07);--warnbg:rgba(147,88,0,.08);--accbg:rgba(31,95,209,.08);--addbg:rgba(22,122,76,.10);--delbg:rgba(197,48,48,.09);--addfg:#0F5E3A;--delfg:#A12626;--shadow:rgba(20,24,32,.18);color-scheme:light;';
    return { theme: t, vars: t === 'light' ? L : D };
  }
  __icons(o) {
    const P = {"✕":["M8 1.6 14.4 8 8 14.4 1.6 8Z","currentColor","none","none"],"▲":["M8 2.2 14.3 13.25H1.7Z M8 6.5v3.1 M8 11.4v.1","none","currentColor","none"],"●":["M8 4.4a3.6 3.6 0 1 1 0 7.2a3.6 3.6 0 1 1 0-7.2Z","currentColor","none","none"],"◐":["M8 2a6 6 0 1 1-6 6","none","currentColor","none"],"‖":["M6 3.75v8.5M10 3.75v8.5","none","currentColor","none"],"○":["M8 2.25a5.75 5.75 0 1 1 0 11.5a5.75 5.75 0 1 1 0-11.5Z","none","currentColor","2.1 2.1"]};
    const mk = (s) => { const c = s.charAt(0); if (!P[c]) return { d: '', f: 'none', s: 'none', da: 'none', w: '0', m: '0', t: s }; const r = s.slice(1).replace(/^\s+/, ''); const p = P[c]; return { d: p[0], f: p[1], s: p[2], da: p[3], w: '1em', m: r ? '.35em' : '0', t: r }; };
    const seen = new Set();
    const walk = (x) => { if (!x || typeof x !== 'object' || seen.has(x)) return; seen.add(x); if (Array.isArray(x)) { x.forEach(walk); return; } Object.keys(x).forEach((k) => { const v = x[k]; if (typeof v === 'string') { if (!k.endsWith('__i')) x[k + '__i'] = mk(v); } else walk(v); }); };
    walk(o); return o;
  }
  renderVals() { return this.__icons(this.__rv()); }
  __rv() {
    const LIST = [['prod-us-east', 'prod', 'v1.31.2', true], ['prod-eu-west', 'prod', 'v1.31.2', true], ['staging', 'staging', 'v1.30.5', true], ['dev-kind', 'dev', 'v1.31.0', true], ['qa-gke', 'staging', 'auth expired', false], ['edge-k3s', 'dev', 'offline 3h', false]];
    const sel = this.props.sel || this.state.sel;
    const set = (next) => { if (this.props.onSel) this.props.onSel(next); else this.setState({ sel: next }); };
    const ids = LIST.map((c) => c[0]);
    const box = (on, part) => ({ box: on || part ? 'background:var(--acc);border:1px solid var(--acc);' : 'border:1px solid var(--line2);', mark: on || part ? '' : 'display:none;', path: part ? 'M4 8h8' : 'M3.5 8.5l3 3 6-7', aria: on ? 'true' : (part ? 'mixed' : 'false') });
    const clusters = LIST.map(([id, env, meta, up]) => Object.assign(box(sel.includes(id), false), {
      name: id, meta, fc: up ? 'var(--fg)' : 'var(--mute)', gearLabel: id + ' settings',
      pick: () => set(sel.includes(id) ? (sel.length > 1 ? sel.filter((x) => x !== id) : sel) : ids.filter((x) => x === id || sel.includes(x)))
    }));
    const all = sel.length === ids.length;
    const open = this.state.open;
    const one = sel.length === 1;
    return {
      vars: this.vars().vars,
      errs: this.props.errs ?? '3', warns: this.props.warns ?? '6',
      hasVersion: one, version: one ? (LIST.find((c) => c[0] === sel[0]) || [])[2] : '',
      label: all ? 'All clusters' : sel[0], more: all || one ? '' : '+' + (sel.length - 1),
      fourth: one ? 'opacity:.25;' : '',
      open, btnBg: open ? 'var(--sel)' : 'transparent', toggle: () => this.setState({ open: !open }),
      allC: Object.assign(box(all, !all && sel.length > 0), { n: sel.length + ' of ' + ids.length, pick: () => set(all ? [ids[0]] : ids) }),
      clusters
    };
  }
}
</script>
</body>
</html>
