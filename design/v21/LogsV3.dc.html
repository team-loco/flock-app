<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logs v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.hv:hover{background:var(--hover)}
.ib{height:24px;box-sizing:border-box;padding:0 8px;border:1px solid var(--line2);border-radius:3px;background:transparent;color:var(--fg2);font-family:'IBM Plex Mono',monospace;font-size:11.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.ib:hover{background:var(--hover)}
.m{background:var(--warnbg);color:var(--fg)!important;box-shadow:inset 0 -1px 0 var(--warn);border-radius:1px}
.cur{background:var(--warn);color:#111317!important;border-radius:1px}
</style>
</helmet>
<div style="{{vars}}font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;color:var(--fg);background:var(--editor);width:100%;height:900px;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;min-height:0;display:flex;flex-wrap:wrap">
    <div style="flex:0 0 auto;display:flex"><sc-if value="{{multi}}" hint-placeholder-val="{{ true }}"><dc-import name="Nav" theme="{{theme}}" mode="fleet" exp="{{ true }}" active="fl-deployments" hint-size="200px,874px"></dc-import></sc-if><sc-if value="{{single}}" hint-placeholder-val="{{ false }}"><dc-import name="Nav" theme="{{theme}}" mode="cluster" active="deployments" loco="{{ false }}" cluster-name="{{oneCluster}}" counts="{{navCounts}}" hint-size="200px,874px"></dc-import></sc-if></div>
    <div style="flex:999 1 560px;min-width:0;height:874px;display:flex;flex-direction:column">
      <dc-import name="PaneTabs" theme="{{theme}}" tabs="{{paneTabs}}" hint-size="100%,32px"></dc-import>

      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)">
        <h1 style="margin:0;font-size:15px;font-weight:600">Logs</h1>
        <div style="flex:10 1 0;min-width:260px;max-width:620px"><dc-import name="QueryBar" theme="{{theme}}" facets="{{facets}}" q="{{qq}}" on-q="{{onQ}}" hint-size="100%,26px"></dc-import></div>
        <div style="display:flex;align-items:center;gap:2px;{{matchShow}}">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--fg2);white-space:nowrap">{{matchPos}}</span>
          <button aria-label="Previous match" onClick="{{prevMatch}}" style="width:20px;height:18px;padding:0;border:0;border-radius:2px;background:transparent;color:var(--fg2);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 10 4-4 4 4"/></svg></button>
          <button aria-label="Next match" onClick="{{nextMatch}}" style="width:20px;height:18px;padding:0;border:0;border-radius:2px;background:transparent;color:var(--fg2);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        </div>
        <span style="flex:1"></span>
        <div role="group" style="display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden"><sc-for list="{{ranges}}" as="r" hint-placeholder-count="4"><button aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="height:22px;padding:0 8px;border:0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;cursor:pointer;{{r.style}}">{{r.label}}<span style="color:{{r.nc}}">{{r.n}}</span></button></sc-for></div>
        <div role="group" aria-label="View" style="display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden"><sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="height:22px;padding:0 8px;border:0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;cursor:pointer;{{o.style}}">{{o.label}}</button></sc-for></div>
        <button class="ib"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8.5M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>Export</button>
      </div>


      <section style="padding:0 16px;border-bottom:1px solid var(--line)">
        <div style="display:flex;align-items:center;gap:8px;height:30px"><button onClick="{{tg.hist}}" aria-expanded="{{op.hist}}" style="flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;color:var(--fg);font-family:inherit;cursor:pointer;text-align:left"><span style="width:10px;flex:none;color:var(--mute);font-size:10px">{{ar.hist}}</span><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)">Volume</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">{{histSum}}</span></button></div>
        <sc-if value="{{op.hist}}" hint-placeholder-val="{{ true }}">
          <div style="margin:0 0 8px 18px">
            <div style="position:relative;height:52px;display:flex;align-items:flex-end;gap:2px">
              <sc-for list="{{hist}}" as="b" hint-placeholder-count="60">
                <div title="{{b.t}}" style="flex:1;min-width:0;height:{{b.h}}%;display:flex;flex-direction:column;gap:1px;opacity:{{b.o}}">
                  <div style="flex:{{b.e}} 1 0;background:var(--err);border-radius:1px 1px 0 0"></div>
                  <div style="flex:{{b.w}} 1 0;background:var(--warn)"></div>
                  <div style="flex:{{b.i}} 1 0;background:var(--acc)"></div>
                  <div style="flex:{{b.d}} 1 0;background:var(--sep)"></div>
                </div>
              </sc-for>
              <div style="position:absolute;top:-2px;bottom:-2px;left:{{brush.l}}%;width:{{brush.w}}%;border:1px solid var(--acc);border-radius:2px;background:var(--accbg);pointer-events:none"></div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--mute)"><sc-for list="{{ticks}}" as="t" hint-placeholder-count="5"><span>{{t}}</span></sc-for></div>
          </div>
        </sc-if>
      </section>

      <div style="flex:1;min-height:0;display:flex">
        <aside aria-label="Sources" style="flex:0 0 250px;min-width:0;overflow:auto;border-right:1px solid var(--line);background:var(--panel);font-size:12.5px">
          <section style="padding:0 12px">
            <div style="display:flex;align-items:center;gap:8px;height:30px"><button onClick="{{tg.src}}" aria-expanded="{{op.src}}" style="flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;color:var(--fg);font-family:inherit;cursor:pointer;text-align:left"><span style="width:10px;flex:none;color:var(--mute);font-size:10px">{{ar.src}}</span><span style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)">Sources</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute)">{{srcSum}}</span></button>
              <div style="position:relative">
                <button onClick="{{toggleGroup}}" aria-haspopup="listbox" aria-expanded="{{groupOpen}}" style="height:22px;display:flex;align-items:center;gap:5px;padding:0 6px;border:1px solid var(--line2);border-radius:3px;background:{{groupBg}};color:var(--fg);font-family:'IBM Plex Mono',monospace;font-size:11.5px;cursor:pointer"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="var(--mute)" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M5 8h8.5M7.5 12h6"/></svg>{{groupLabel}}<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--mute)"><path d="m4 6 4 4 4-4"/></svg></button>

                    <sc-for list="{{groupOpts}}" as="gq" hint-placeholder-count="4">
                      <div onClick="{{gq.pick}}" role="option" aria-selected="{{gq.on}}" class="hv" style="display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:3px;cursor:pointer;font-size:13px"><span style="width:13px;height:13px;flex:none;box-sizing:border-box;border-radius:3px;display:flex;align-items:center;justify-content:center;{{gq.box}}"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="var(--onacc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{gq.mark}}"><path d="M3.5 8.5l3 3 6-7"/></svg></span>{{gq.label}}<span style="flex:1"></span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute)">{{gq.ord}}</span></div>
                    </sc-for>
                  </div>
                </sc-if>
              </div></div>
            <sc-if value="{{op.src}}" hint-placeholder-val="{{ true }}">
              <div style="margin:0 0 10px;display:flex;flex-direction:column;gap:10px">
                <div style="display:flex;flex-direction:column;gap:2px">
                <sc-for list="{{srcList}}" as="s" hint-placeholder-count="8">
                  <sc-if value="{{s.isHead}}" hint-placeholder-val="{{ false }}"><div onClick="{{s.toggle}}" class="hv" style="display:flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 {{s.pad}};border-radius:3px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:{{s.mt}}"><span style="width:10px;color:var(--mute);font-size:10px">{{s.arrow}}</span><span style="font-size:10.5px;color:var(--mute);{{s.keyShow}}">{{s.key}}</span><span style="font-weight:{{s.fw}};color:{{s.hc}};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{s.name}}</span><span style="flex:1"></span><span style="font-size:11px;color:var(--mute)">{{s.n}}</span></div></sc-if>
                  <sc-if value="{{s.isSrc}}" hint-placeholder-val="{{ true }}">
                      <button onClick="{{s.toggle}}" aria-pressed="{{s.on}}" class="hv" style="display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:6px;align-items:center;padding:3px 0 3px {{s.pad}};border:0;background:transparent;color:var(--fg);text-align:left;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:{{s.op}}">
                        <span style="width:10px;height:10px;border-radius:2px;box-sizing:border-box;{{s.sw}}"></span>
                        <span style="display:flex;flex-direction:column;min-width:0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="color:var(--mute);{{s.wlShow}}">{{s.wl}} · </span>{{s.pod}} <span style="color:var(--mute)">·</span> {{s.ctr}}</span><span style="font-size:10.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{s.clShow}}">{{s.cluster}}</span><span style="font-size:10.5px;color:{{s.rc}};{{s.metaShow}}">{{s.meta}}</span></span>
                        <span style="font-size:11px;color:var(--mute)">{{s.n}}</span>
                      </button>
                  </sc-if>
                </sc-for>
                </div>
                <button class="hv" style="display:flex;align-items:center;gap:6px;padding:4px 0 4px 18px;border:0;background:transparent;color:var(--acc);font-family:inherit;font-size:12.5px;cursor:pointer;text-align:left"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add source</button>
              </div>
            </sc-if>
          </section>
        </aside>

        <div role="log" style="flex:1;min-width:0;overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:20px;padding:4px 0">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="20">
            <div class="hv" style="display:grid;{{lineCols}}column-gap:10px;padding:0 16px 0 6px;{{l.bg}}">
              <span style="color:var(--acc);display:flex;align-items:center;justify-content:center">{{l.mk}}</span>
              <span style="color:var(--mute);{{l.tsStyle}}">{{l.ts}}</span>
              <span style="color:{{l.lc}}">{{l.lv}}</span>
              <span style="display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap"><span style="width:3px;height:14px;flex:none;border-radius:1px;background:{{l.sc}}"></span><span style="color:var(--fg2);overflow:hidden;text-overflow:ellipsis">{{l.wl}}</span><span style="color:var(--mute)">{{l.pod}}/{{l.ctr}}</span><span style="color:var(--mute);opacity:.75;{{clusterShow}}">{{l.cluster}}</span></span>
              <span style="min-width:0;{{l.wrap}}"><sc-for list="{{l.parts}}" as="p" hint-placeholder-count="1"><span class="{{p.cls}}" style="color:{{p.c}}">{{p.t}}</span></sc-for></span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
  <dc-import name="StatusBarMulti" theme="{{theme}}" sel="{{clusters}}" on-sel="{{onSel}}" hint-size="100%,26px"></dc-import>
</div>
</x-dc>
