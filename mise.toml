[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-src,rust-analyzer" }
"cargo:cargo-nextest" = "0.9.148"
"cargo:kopium" = "0.24.1"
"cargo:cargo-bundle" = "0.12.0"
cargo-deny = "0.20.2"
lefthook = "2.2.1"
typos = "1.51.1"
kind = "0.33.0"
kubectl = "1.37.1"
flux2 = "2.9.6"
helm = "4.3.0"
uv = "0.13.0"

[settings]
cargo.binstall = true

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks.run]
description = "Run Flock against your kubeconfig"
run = "cargo run -p flock"

[tasks.demo]
description = "Run Flock on the design's sample data"
run = "cargo run -p flock -- --demo"

[tasks."run:loco"]
description = "Run Flock with Loco support on sample data"
run = "cargo run -p flock --features loco -- --demo"

[tasks."bundle:loco"]
description = "Build and ad-hoc sign dist/Flock.app with Loco support"
run = "mise-tasks/bundle --features loco"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy with warnings denied, with and without Loco"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo clippy --workspace --all-targets --features flock-shots/loco -- -D warnings",
]

[tasks.test]
description = "Run tests with and without Loco"
run = [
  "cargo nextest run --workspace --no-tests=pass",
  "cargo nextest run --workspace --no-tests=pass --features flock-shots/loco",
]

[tasks.typos]
description = "Spell check"
run = "typos"

[tasks.deny]
description = "Check licenses, advisories and sources"
run = "cargo deny check licenses bans sources"

[tasks.check]
description = "Everything a PR needs"
depends = ["fmt", "lint", "test", "typos", "deny"]

[env]
FLOCK_SCALE_IMAGE = "registry.k8s.io/pause:3.10"
LOCO_REF = "v0.0.119"

[tasks."gen:keys"]
description = "Regenerate docs/keyboard.md from the binding table"
run = "FLOCK_UPDATE_DOCS=1 cargo test -p flock-ui --lib keymap::tests::docs_are_generated_from_the_table"
