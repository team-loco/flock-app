apiVersion: v1
kind: Namespace
metadata:
  name: loco-control-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: loco-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: POSTGRES_IMAGE
          env:
            - name: POSTGRES_USER
              value: loco
            - name: POSTGRES_DB
              value: loco
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loco-postgres
                  key: password
          readinessProbe:
            exec:
              command: [pg_isready, -U, loco, -d, loco]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: loco-control-plane
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
