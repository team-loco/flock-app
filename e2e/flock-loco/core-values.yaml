agent:
  clusterName: flock-loco
  clusterRegion: local
  clusterTier: dev
  imagePullPolicy: IfNotPresent
  buildRetention: 8760h
env:
  LOG_LEVEL: info
  CONTROL_PLANE_URL: http://loco-api.loco-system.svc.cluster.local:8000
  AGENT_TOKEN: flock-e2e-agent-token-not-a-secret
certManager:
  issuer:
    email: e2e@flock.test
