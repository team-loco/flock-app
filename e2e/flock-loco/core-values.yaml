agent:
  clusterName: flock-loco
  clusterRegion: local
  clusterTier: dev
  imagePullPolicy: IfNotPresent
  buildRetention: 8760h
env:
  LOG_LEVEL: info
  CONTROL_PLANE_URL: http://loco-api.loco-control-plane.svc.cluster.local
  AGENT_TOKEN: flock-e2e-agent-token-not-a-secret
certManager:
  existingTLSSecret: flock-loco-gateway-tls
