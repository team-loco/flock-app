apiVersion: v1
kind: Namespace
metadata:
  name: ledger
---
apiVersion: v1
kind: Namespace
metadata:
  name: rollouts
---
apiVersion: v1
kind: Namespace
metadata:
  name: archive
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ledger-api
  namespace: ledger
spec:
  interval: 1m
  timeout: 1m
  releaseName: ledger-api
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  chart:
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  values:
    fullnameOverride: ledger-api
    extraArgs:
      - --flock-invalid-flag
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ledger-migrations
  namespace: ledger
spec:
  interval: 1m
  timeout: 1h
  releaseName: ledger-migrations
  chart:
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ledger-migrations
            patch: |
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 7200
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
                value: 7200
  values:
    fullnameOverride: ledger-migrations
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rollouts
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 1h
  path: ./kustomize
  prune: true
  wait: true
  targetNamespace: rollouts
  sourceRef:
    kind: GitRepository
    name: podinfo
  patches:
    - target:
        kind: Deployment
        name: podinfo
      patch: |
        - op: add
          path: /spec/progressDeadlineSeconds
          value: 7200
        - op: replace
          path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
          value: 7200
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: frozen-kustomization
  namespace: flux-system
spec:
  suspend: true
  interval: 1m
  path: ./kustomize
  prune: true
  targetNamespace: archive
  sourceRef:
    kind: GitRepository
    name: podinfo
---
apiVersion: v1
kind: Namespace
metadata:
  name: reports
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-report-backfill
  namespace: reports
spec:
  completions: 100
  parallelism: 8
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: ghcr.io/stefanprodan/podinfo:latest
          command: ["sh", "-c", "echo report done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
