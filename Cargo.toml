[workspace]
resolver = "3"
members = [
  "apps/flock",
  "apps/flock-bench",
  "apps/flock-shots",
  "crates/flock-core",
  "crates/flock-demo",
  "crates/flock-flux",
  "crates/flock-kube",
  "crates/flock-loco",
  "crates/flock-ui",
  "crates/flock-update",
]

[workspace.package]
version = "0.2.11"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/team-loco/flock-app"
publish = false

[workspace.dependencies]
flock = { path = "apps/flock" }
flock-core = { path = "crates/flock-core" }
flock-demo = { path = "crates/flock-demo" }
flock-flux = { path = "crates/flock-flux" }
flock-kube = { path = "crates/flock-kube" }
flock-loco = { path = "crates/flock-loco" }
flock-ui = { path = "crates/flock-ui" }
flock-update = { path = "crates/flock-update" }

anyhow = "1.0.104"
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false }
dhat = "0.3.3"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["font-kit"] }
gpui-base = "0.7.3"
gpui-component = "0.7.3"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "0.2.38"
json-patch = "4.2.0"
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "ws", "jsonpatch"] }
notify = "8.2.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibilityProtocols", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSImage", "NSCell", "NSColor", "NSFont", "NSFontDescriptor", "NSParagraphStyle", "NSText", "NSAttributedString", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSGeometry", "NSRange"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
serde_norway = "0.9.42"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tower-service = "0.3.3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs"] }
tracing = "0.1.44"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
flate2 = "1.1.10"
base64 = "0.23.1"
similar = "3.2.0"
vt100 = "0.16.2"
x509-parser = { version = "0.18.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
