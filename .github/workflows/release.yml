name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
      - name: Build both variants and zip them
        run: |
          mise run package
          mise run package -- --loco
      - name: Sign the zips
        env:
          FLOCK_UPDATE_SIGNING_KEY: ${{ secrets.FLOCK_UPDATE_SIGNING_KEY }}
        run: |
          for zip in dist/Flock-*.zip; do
            mise run sign -- "$zip"
          done
      - name: Write release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          range="$TAG"
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
          fi
          git log --no-merges --pretty='- %s (%h)' "$range" > dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" dist/Flock-*.zip dist/Flock-*.zip.sha256 dist/Flock-*.zip.sig \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Flock $version" \
            --notes-file dist/notes.md \
            $prerelease
